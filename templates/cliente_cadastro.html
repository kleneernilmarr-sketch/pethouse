{% extends "base.html" %}
{% block titulo %}Criar conta{% endblock %}
{% block pagina %}cliente-cadastro{% endblock %}
{% block conteudo %}
  <section class="secao form-caixa">
    <h1>Criar conta</h1>
    <form method="post">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" value="{{ dados.get('nome', '') }}" required>
      </div>
      <div class="linha-formulario">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" value="{{ dados.get('email', '') }}" required>
        </div>
        <div class="campo">
          <label for="telefone">Telefone / WhatsApp</label>
          <input type="tel" id="telefone" name="telefone" value="{{ dados.get('telefone', '') }}">
        </div>
      </div>
      <div class="campo">
        <label for="senha">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="senha" name="senha" required minlength="6">
      </div>
      <div class="campo">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" name="endereco" value="{{ dados.get('endereco', '') }}">
      </div>
      <div class="linha-formulario">
        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" value="{{ dados.get('cidade', '') }}">
        </div>
        <div class="campo">
          <label for="estado">UF</label>
          <input type="text" id="estado" name="estado" maxlength="2" value="{{ dados.get('estado', '') }}">
        </div>
        <div class="campo">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" value="{{ dados.get('cep', '') }}">
        </div>
      </div>
      <button type="submit" class="btn btn-sol btn-bloco">Criar conta</button>
    </form>
    <p class="form-rodape">
      Já tem conta? <a href="{{ url_for('cliente_login') }}">Entrar</a>
    </p>
  </section>
{% endblock %}
