{% macro card(p) %}
  <article class="card-produto">
    <a href="{{ url_for('produto', id=p.id) }}" class="card-produto-imagem" style="--cor: {{ p.cor }}">
      {% set foto = imagem_url('produtos', p.imagem) %}
      {% if foto %}
        <img src="{{ foto }}" alt="{{ p.nome }}" loading="lazy">
      {% else %}
        {{ p.emoji }}
      {% endif %}
    </a>
    <div class="card-produto-corpo">
      {% if p.desconto %}<span class="badge-desconto">-{{ p.desconto }}%</span>{% endif %}
      <a href="{{ url_for('produto', id=p.id) }}" class="card-produto-nome">{{ p.nome }}</a>
      <div class="card-produto-precos">
        <span class="preco-atual">{{ p.preco | brl }}</span>
        {% if p.preco_antigo %}<span class="preco-antigo">{{ p.preco_antigo | brl }}</span>{% endif %}
      </div>
    </div>
    <div class="card-produto-acoes">
      <form action="{{ url_for('carrinho_adicionar', produto_id=p.id) }}" method="post">
        <input type="hidden" name="quantidade" value="1">
        <button type="submit" class="btn btn-sol btn-pequeno">Adicionar ao carrinho</button>
      </form>
    </div>
  </article>
{% endmacro %}
