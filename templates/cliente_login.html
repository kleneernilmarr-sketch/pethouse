{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block pagina %}cliente-login{% endblock %}
{% block conteudo %}
  <section class="secao form-caixa">
    <h1>Entrar</h1>
    <form method="post">
      <input type="hidden" name="proximo" value="{{ proximo }}">
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>
      </div>
      <button type="submit" class="btn btn-sol btn-bloco">Entrar</button>
    </form>
    <p class="form-rodape">
      Ainda não tem conta? <a href="{{ url_for('cliente_cadastro') }}">Criar conta</a>
    </p>
  </section>
{% endblock %}
